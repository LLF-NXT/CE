<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-title" content="ISIC">
    <title>Carte Étudiante</title>
    
    <style>
        html, body {
            background-color: #ffffff !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; /* Adapts to iOS dynamic URL bar */
            display: flex;
            justify-content: center;
            /* Avoid iPhone notch dynamically */
            padding-top: env(safe-area-inset-top, 55px);
            box-sizing: border-box;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Container that strictly respects the 576/1024 ratio */
        #card {
            aspect-ratio: 576 / 1024;
            height: 100%; /* Scales to max available height */
            max-width: 100%; /* Prevents horizontal overflow on very narrow screens */
            position: relative;
            background-image: url('background.jpg');
            background-size: 100% 100%; /* Stretches background perfectly inside the ratio */
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            /* Allows responsive font scaling relative to the card size */
            container-type: size;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .dot {
            position: absolute;
            top: 7.2%;
            left: 13.5%;
            width: 2.2cqw;
            height: 2.2cqw;
            background-color: #4dc0bb;
            border-radius: 50%;
            animation: blink 1.2s infinite ease-in-out;
        }
        
        #valide-text {
            position: absolute;
            top: 6.7%;
            left: 18%;
            color: white;
            font-size: 2.8cqw;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        #clock {
            position: absolute;
            top: 6.7%;
            right: 4.5%;
            color: white;
            font-size: 2.5cqw;
            font-variant-numeric: tabular-nums;
            font-weight: 400;
        }

        #isic {
            position: absolute;
            top: 15.3%;
            right: 4.5%;
            color: #111;
            font-size: 2.4cqw;
            font-weight: 500;
        }

        #photo {
            position: absolute;
            top: 25.4%;
            left: 32.7%;
            width: 34%; /* Accurately covering the white box */
            height: 22.5%;
            object-fit: cover;
            border-radius: 4px;
            background-color: #f0f0f0;
            z-index: 2;
        }

        .hitbox {
            position: absolute;
            top: 25%;
            right: 4%;
            width: 26%;
            height: 12%;
            cursor: pointer;
            z-index: 10;
        }

        #name {
            position: absolute;
            top: 51.5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 4.5cqw;
            color: #1a1a1a;
        }

        #validity {
            position: absolute;
            top: 65.5%;
            left: 8.5%;
            font-size: 3cqw;
            font-weight: 700;
            color: #222;
        }

        #dob {
            position: absolute;
            top: 65.5%;
            right: 12%;
            font-size: 3cqw;
            font-weight: 700;
            color: #222;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 14px;
            padding: 24px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .modal-content input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            display: block;
            box-sizing: border-box;
        }

        .btn-photo { background-color: #f5f5f5; color: #333; border: 1px solid #ddd; }
        .btn-save { background-color: #4dc0bb; color: white; }
        .btn-cancel { background-color: transparent; color: #888; font-weight: normal; margin-bottom: 0; }
    </style>
</head>
<body>

    <div id="card">
        <div class="dot"></div>
        <div id="valide-text">VALIDE</div>
        <div id="clock">DD-MM-YYYY | HH:MM:SS</div>
        
        <div id="isic">S 000 000 000 000 X</div>
        
        <!-- Default Photo -->
        <img id="photo" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%25%22%20height%3D%22100%25%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23e0e0e0%22%2F%3E%3Cpath%20d%3D%22M50%2035a14%2014%200%201%200%200%2028%2014%2014%200%200%200%200-28zm0%2034c-15.5%200-46%207.8-46%2023v6h92v-6c0-15.2-30.5-23-46-23z%22%20fill%3D%22%239e9e9e%22%2F%3E%3C%2Fsvg%3E" alt="Profil">
        
        <!-- Hitbox over HEC logo to open settings -->
        <div class="hitbox" onclick="openEditModal()"></div>
        
        <div id="name">Prénom Nom</div>
        <div id="validity">09/2026 – 12/2027</div>
        <div id="dob">DD. MM. YYYY</div>
        
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#333; font-size: 18px;">Modifier les infos</h3>
            
            <input type="text" id="inputName" placeholder="Prénom Nom">
            <input type="text" id="inputDob" placeholder="DD. MM. YYYY">
            
            <button class="btn btn-photo" onclick="document.getElementById('fileInput').click()">📸 Changer la photo</button>
            <button class="btn btn-save" onclick="saveModalData()">Enregistrer</button>
            <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
        </div>
    </div>

    <script>
        // Generate Dynamic Apple Touch Icon (#4dc0bb)
        (function generateIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4dc0bb';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 160px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ISIC', 256, 256);
            const link = document.createElement('link');
            link.rel = 'apple-touch-icon';
            link.href = canvas.toDataURL('image/png');
            document.head.appendChild(link);
        })();

        // Update clock and date
        function updateClock() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${d}-${mo}-${y} | ${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Dynamic validity based on current academic year
        function setValidity() {
            const now = new Date();
            const month = now.getMonth() + 1;
            let startYear = now.getFullYear();
            if (month < 8) startYear -= 1; // Before August belongs to previous academic year
            document.getElementById('validity').textContent = `09/${startYear} – 12/${startYear + 1}`;
        }
        setValidity();

        // Generate or load ISIC number
        function initISIC() {
            let isic = localStorage.getItem('isic_number');
            if (!isic) {
                // Generates "S XXX XXX XXX XXX X"
                const r = () => Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                const lastDigit = Math.floor(Math.random() * 10);
                isic = `S ${r()} ${r()} ${r()} ${r()} ${lastDigit}`;
                localStorage.setItem('isic_number', isic);
            }
            document.getElementById('isic').textContent = isic;
        }
        initISIC();

        // Load data from localStorage on startup
        function loadData() {
            const name = localStorage.getItem('isic_name');
            if (name) document.getElementById('name').textContent = name;
            
            const dob = localStorage.getItem('isic_dob');
            if (dob) document.getElementById('dob').textContent = dob;
            
            const photo = localStorage.getItem('isic_photo');
            if (photo) document.getElementById('photo').src = photo;
        }
        loadData();

        const modal = document.getElementById('editModal');
        
        function openEditModal() {
            document.getElementById('inputName').value = document.getElementById('name').textContent;
            document.getElementById('inputDob').value = document.getElementById('dob').textContent;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            // Reset file input so the same file can be selected again if needed
            document.getElementById('fileInput').value = ''; 
        }

        // Extremely fast save function - no image processing here, just text
        function saveModalData() {
            const newName = document.getElementById('inputName').value.trim();
            const newDob = document.getElementById('inputDob').value.trim();
            
            if(newName) {
                document.getElementById('name').textContent = newName;
                localStorage.setItem('isic_name', newName);
            }
            if(newDob) {
                document.getElementById('dob').textContent = newDob;
                localStorage.setItem('isic_dob', newDob);
            }
            
            // Instantly close modal
            closeModal();
        }

        // Process image silently in the background right after selection
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 350; // Keeps file size very small for localStorage
                    let width = img.width;
                    let height = img.height;

                    // Calculate aspect ratio for resizing
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress to Base64 (JPEG, 70% quality)
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7); 
                    
                    // Update UI immediately
                    document.getElementById('photo').src = compressedBase64;
                    
                    // Save to local storage silently
                    try {
                        localStorage.setItem('isic_photo', compressedBase64);
                    } catch (e) {
                        console.error("Storage limit exceeded, photo not saved persistently.", e);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
