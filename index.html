<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Meta PWA stricte -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-title" content="ISIC">
    <title>Carte Étudiante</title>
    
    <script>
        // Génération automatique de l'icône iOS
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#4dc0bb';
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 160px -apple-system, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ISIC', 256, 276); 
            
            const link = document.createElement('link');
            link.rel = 'apple-touch-icon';
            link.href = canvas.toDataURL('image/png');
            document.head.appendChild(link);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: white;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Aligne la carte tout en haut */
        }

        .card-container {
            width: 100vw;
            max-width: 500px;
            aspect-ratio: 1080 / 1920; 
            position: relative;
            background-image: url('bg.jpg'); /* Votre nouveau background */
            background-size: 100% 100%; 
            background-position: top center;
            background-repeat: no-repeat;
            container-type: inline-size;
        }

        /* La barre noire en haut */
        .top-bar {
            position: absolute;
            top: 10.5%; /* Descendu pour être dans la barre noire */
            left: 6%;
            right: 6%;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
            font-size: 3.5cqi; 
        }

        .status {
            display: flex;
            align-items: center;
            gap: 2cqi;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .dot {
            width: 14px;
            height: 14px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00, 0 0 15px #00ff00;
            animation: blink 1.2s infinite alternate ease-in-out;
        }

        @keyframes blink {
            0% { opacity: 0.6; box-shadow: 0 0 5px #00ff00; transform: scale(0.95); }
            100% { opacity: 1; box-shadow: 0 0 15px #00ff00, 0 0 20px #00ff00; transform: scale(1.05); }
        }

        .clock-display {
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        /* Numéro de carte ISIC */
        .isic-number {
            position: absolute;
            top: 18.5%; /* Ajusté pour la nouvelle maquette */
            right: 7%; 
            text-align: right;
            font-family: sans-serif;
            font-size: 3.4cqi;
            color: #113643;
            letter-spacing: 0.1cqi;
            font-weight: 600;
        }

        /* Photo de profil */
        .profile-pic {
            position: absolute;
            top: 29.5%; /* Descendu pour le nouvel encart blanc */
            left: 33.2%;
            width: 33.6%;
            height: 22.5%;
            object-fit: cover;
            background-color: #f4f4f4;
            border-radius: 12px; 
            z-index: 2;
        }

        /* Textes */
        .name {
            position: absolute;
            top: 55%; /* Descendu sous la photo */
            left: 0;
            width: 100%;
            text-align: center;
            font-family: sans-serif;
            font-size: 6.5cqi;
            font-weight: bold;
            color: #113643;
        }

        .validity {
            position: absolute;
            top: 67%;
            left: 10%;
            width: 40%;
            text-align: center;
            font-family: sans-serif;
            font-size: 4.5cqi;
            font-weight: bold;
            color: #113643;
            white-space: nowrap;
        }

        .birthdate {
            position: absolute;
            top: 67%;
            right: 12%; 
            width: 40%;
            text-align: center;
            font-family: sans-serif;
            font-size: 4.5cqi;
            font-weight: bold;
            color: #113643;
            white-space: nowrap;
        }

        /* Hitbox HEC pour modifier */
        .hitbox {
            position: absolute;
            top: 29%;
            right: 5%;
            width: 25%;
            height: 15%;
            z-index: 10;
            cursor: pointer;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .modal-content h3 {
            margin-top: 0;
            color: #113643;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .modal-content input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            background-color: #f9f9f9;
            outline: none;
            color: #333;
            -webkit-appearance: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .btn-photo { background-color: #f0f0f0; color: #113643; }
        .btn-save { background-color: #4dc0bb; color: white; margin-top: 10px; }
        .btn-cancel { background-color: transparent; color: #888; margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="top-bar">
            <div class="status">
                <div class="dot"></div>
                &lt; VALIDE
            </div>
            <div class="clock-display" id="clock">---MM-YYYY | HH:MM:SS</div>
        </div>
        
        <div class="isic-number" id="isic">S 000 000 000 000 X</div>
        
        <img class="profile-pic" id="photo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Profil">
        
        <div class="hitbox" onclick="openModal()"></div>
        
        <div class="name" id="name">Karolína Veselá</div>
        <div class="validity" id="validity">09/2026 - 12/2027</div>
        <div class="birthdate" id="birthdate">21. 03. 2000</div>
        
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Modifier les informations</h3>
            <input type="text" id="inputName" placeholder="Prénom Nom">
            <input type="text" id="inputBirthdate" placeholder="DD. MM. YYYY">
            <button class="btn btn-photo" onclick="document.getElementById('fileInput').click()">📸 Modifier la photo</button>
            <button class="btn btn-save" onclick="saveModal()">Enregistrer</button>
            <button class="btn btn-cancel" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${d}-${mo}-${y} | ${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function initISIC() {
            let isic = localStorage.getItem('isic_number');
            if (!isic) {
                const r = () => Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                isic = `S ${r()} ${r()} ${r()} ${r()} X`;
                localStorage.setItem('isic_number', isic);
            }
            document.getElementById('isic').textContent = isic;
        }

        function calculateValidity() {
            const now = new Date();
            const currentMonth = now.getMonth(); 
            const currentYear = now.getFullYear();
            const startYear = currentMonth >= 7 ? currentYear : currentYear - 1;
            const endYear = startYear + 1;
            return `09/${startYear} - 12/${endYear}`;
        }

        function loadData() {
            initISIC();
            document.getElementById('validity').textContent = calculateValidity();
            const savedName = localStorage.getItem('isic_name');
            if (savedName) document.getElementById('name').textContent = savedName;
            const savedBirth = localStorage.getItem('isic_birthdate');
            if (savedBirth) document.getElementById('birthdate').textContent = savedBirth;
            const savedPhoto = localStorage.getItem('isic_photo');
            if (savedPhoto) document.getElementById('photo').src = savedPhoto;
        }
        loadData();

        const modal = document.getElementById('editModal');
        
        function openModal() {
            document.getElementById('inputName').value = document.getElementById('name').textContent;
            document.getElementById('inputBirthdate').value = document.getElementById('birthdate').textContent;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('fileInput').value = ''; 
        }

        function saveModal() {
            const newName = document.getElementById('inputName').value.trim();
            const newBirth = document.getElementById('inputBirthdate').value.trim();
            if (newName) {
                document.getElementById('name').textContent = newName;
                localStorage.setItem('isic_name', newName);
            }
            if (newBirth) {
                document.getElementById('birthdate').textContent = newBirth;
                localStorage.setItem('isic_birthdate', newBirth);
            }
            closeModal();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500; 
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7); 
                    document.getElementById('photo').src = compressedBase64;
                    try {
                        localStorage.setItem('isic_photo', compressedBase64);
                    } catch (err) {}
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
