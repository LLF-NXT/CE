<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-title" content="ISIC">
    <title>Carte Étudiante</title>
    
    <script>
        // Générer dynamiquement l'icône d'application iOS au chargement
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Fond de l'icône (#4dc0bb)
            ctx.fillStyle = '#4dc0bb';
            ctx.fillRect(0, 0, 512, 512);
            
            // Texte de l'icône "ISIC"
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 160px -apple-system, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ISIC', 256, 276); // Légèrement décalé vers le bas pour l'équilibre visuel
            
            const link = document.createElement('link');
            link.rel = 'apple-touch-icon';
            link.href = canvas.toDataURL('image/png');
            document.head.appendChild(link);
        })();
    </script>

    <style>
        /* Strict CSS reset: NO margins, completely flush to top */
        * {
            box-sizing: border-box;
        }

        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Forcer le collage tout en haut de l'écran */
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Container that STRICTLY respects the 1080/1920 ratio */
        .card-container {
            position: relative;
            width: 100vw;
            max-width: 600px; /* Limite de sécurité pour tablettes/ordinateurs */
            aspect-ratio: 1080 / 1920;
            background-image: url('background.jpg');
            background-size: 100% 100%;
            background-position: top center;
            background-repeat: no-repeat;
            margin: 0; /* Aucune marge pour rester collé en haut */
            padding: 0;
            overflow: hidden;
            container-type: inline-size; /* Pour utiliser 'cqi' pour les tailles de police */
        }

        /* Top Bar Elements */
        #top-left {
            position: absolute;
            top: 4.2%;
            left: 13.5%;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 3.5cqi;
            font-weight: 500;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }

        .dot {
            width: 3.2cqi;
            aspect-ratio: 1;
            background-color: #4dc0bb;
            border-radius: 50%;
            animation: blink 1.5s infinite ease-in-out;
        }
        
        #clock {
            position: absolute;
            top: 3.8%;
            right: 4.5%;
            color: #fff;
            font-size: 3.3cqi;
            font-variant-numeric: tabular-nums;
            font-weight: 400;
        }

        /* ISIC Number */
        #isic {
            position: absolute;
            top: 15.2%;
            right: 9%;
            color: #111;
            font-size: 3.2cqi;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Profile Photo */
        #photo {
            position: absolute;
            top: 25.4%;
            left: 31.4%;
            width: 37.2%;
            height: 23.3%;
            object-fit: cover;
            border-radius: 4px;
            z-index: 2;
            display: none;
            background-color: #f0f0f0;
        }

        /* Invisible hitbox over HEC logo */
        .hitbox {
            position: absolute;
            top: 25%;
            right: 2%;
            width: 25%;
            height: 15%;
            cursor: pointer;
            z-index: 10;
        }

        /* Text Elements */
        #name {
            position: absolute;
            top: 51.5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 5.5cqi;
            color: #1a1a1a;
        }

        #validity {
            position: absolute;
            top: 66.8%;
            left: 10%;
            font-size: 3.8cqi;
            font-weight: 600;
            color: #1a1a1a;
        }

        #dob {
            position: absolute;
            top: 66.8%;
            right: 18%;
            font-size: 3.8cqi;
            font-weight: 600;
            color: #1a1a1a;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 340px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .modal-content input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px; /* 16px prevents iOS zoom on focus */
            font-family: inherit;
            background-color: #f8f8f8;
            outline: none;
        }

        .modal-content input[type="text"]:focus {
            border-color: #4dc0bb;
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            display: block;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.7; }
        .btn-photo { background-color: #f0f0f0; color: #333; }
        .btn-save { background-color: #4dc0bb; color: white; margin-top: 15px; }
        .btn-cancel { background-color: transparent; color: #888; font-weight: normal; margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="card-container">
        
        <div id="top-left">
            <div class="dot"></div>
            <!-- Texte retiré si présent dans l'image, sinon ajoutez un <span> ici -->
        </div>
        
        <div id="clock">DD-MM-YYYY | HH:MM:SS</div>
        
        <div id="isic">S 000 000 000 000 X</div>
        
        <img id="photo" src="" alt="Profil">
        
        <!-- Hitbox (Zone de clic) sur le logo HEC -->
        <div class="hitbox" onclick="openEditModal()"></div>
        
        <div id="name">Prénom Nom</div>
        
        <div id="validity">09/2024 – 12/2025</div>
        <div id="dob">21. 03. 2000</div>
        
        <!-- Hidden file input for photo upload -->
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#111; font-size: 18px; margin-bottom: 20px;">Modifier la carte</h3>
            
            <input type="text" id="inputName" placeholder="Prénom Nom">
            <input type="text" id="inputDob" placeholder="DD. MM. YYYY">
            
            <button class="btn btn-photo" onclick="document.getElementById('fileInput').click()">📸 Modifier la photo</button>
            <button class="btn btn-save" onclick="saveModalData()">Enregistrer</button>
            <button class="btn btn-cancel" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        // 1. Mise à jour de l'horloge en temps réel
        function updateClock() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${d}-${mo}-${y} | ${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Validité dynamique basée sur l'année scolaire en cours
        function setValidity() {
            const now = new Date();
            const month = now.getMonth() + 1; // 1-12
            let startYear = now.getFullYear();
            // L'année académique commence généralement en septembre
            if (month < 8) { 
                startYear -= 1; 
            }
            document.getElementById('validity').textContent = `09/${startYear} - 12/${startYear + 1}`;
        }
        setValidity();

        // 3. Génération du numéro ISIC (S suivi de 12 chiffres aléatoires puis X)
        function initISIC() {
            let isic = localStorage.getItem('isic_number');
            if (!isic) {
                const r = () => Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                const lastDigit = Math.floor(Math.random() * 10);
                isic = `S ${r()} ${r()} ${r()} ${r()} ${lastDigit} X`;
                localStorage.setItem('isic_number', isic);
            }
            document.getElementById('isic').textContent = isic;
        }
        initISIC();

        // 4. Chargement des données sauvegardées
        function loadData() {
            const name = localStorage.getItem('isic_name');
            if (name) document.getElementById('name').textContent = name;
            
            const dob = localStorage.getItem('isic_dob');
            if (dob) document.getElementById('dob').textContent = dob;
            
            const photo = localStorage.getItem('isic_photo');
            const photoEl = document.getElementById('photo');
            if (photo) {
                photoEl.src = photo;
                photoEl.style.display = 'block';
            }
        }
        loadData();

        // 5. Gestion de la modale
        const modal = document.getElementById('editModal');
        
        function openEditModal() {
            document.getElementById('inputName').value = document.getElementById('name').textContent;
            document.getElementById('inputDob').value = document.getElementById('dob').textContent;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('fileInput').value = ''; 
        }

        function saveModalData() {
            const newName = document.getElementById('inputName').value.trim();
            const newDob = document.getElementById('inputDob').value.trim();
            
            if (newName) {
                document.getElementById('name').textContent = newName;
                localStorage.setItem('isic_name', newName);
            }
            if (newDob) {
                document.getElementById('dob').textContent = newDob;
                localStorage.setItem('isic_dob', newDob);
            }
            // La sauvegarde est immédiate
            closeModal();
        }

        // 6. Gestion de l'upload d'image avec compression pour localStorage
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; // Largeur max pour compression
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Conversion en base64 (qualité 80%)
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8); 
                    
                    const photoEl = document.getElementById('photo');
                    photoEl.src = compressedBase64;
                    photoEl.style.display = 'block';
                    
                    try {
                        localStorage.setItem('isic_photo', compressedBase64);
                    } catch (err) {
                        console.error("Quota localStorage dépassé", err);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
