<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-title" content="ISIC">
    <title>Carte Étudiante</title>
    
    <script>
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Fond cyan
            ctx.fillStyle = '#4dc0bb';
            ctx.fillRect(0, 0, 512, 512);
            
            // Texte ISIC
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 160px -apple-system, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ISIC', 256, 276); 
            
            const link = document.createElement('link');
            link.rel = 'apple-touch-icon';
            link.href = canvas.toDataURL('image/png');
            document.head.appendChild(link);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: white;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: flex-start; /* Aligne la carte tout en haut */
            justify-content: center;
        }

        .card {
            width: 100vw;
            max-width: 100%;
            aspect-ratio: 1080 / 1920; /* Ratio strict de l'image */
            position: relative;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: top center;
            overflow: hidden;
        }

        .top-bar {
            position: absolute;
            top: 6.2%;
            left: 5%;
            right: 5%;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        .dot {
            width: 15px;
            height: 15px;
            background-color: #39ff14; /* Vert néon */
            border-radius: 50%;
            box-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14; /* Effet néon plus prononcé */
            animation: pulse 1.2s infinite alternate ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.6; box-shadow: 0 0 5px #39ff14; transform: scale(0.95); }
            100% { opacity: 1; box-shadow: 0 0 15px #39ff14, 0 0 25px #39ff14; transform: scale(1.05); }
        }

        .clock-display {
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            font-size: 15px;
        }

        .isic-number {
            position: absolute;
            top: 15.5%;
            left: 63.5%;
            font-family: sans-serif;
            font-size: 14px;
            color: #000;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .profile-pic {
            position: absolute;
            top: 25.4%;
            left: 50%;
            transform: translateX(-50%);
            width: 31%; /* Légèrement plus petite */
            height: 21%;
            object-fit: cover;
            background-color: #f0f0f0;
            border-radius: 2px;
            z-index: 2;
        }

        .name {
            position: absolute;
            top: 51%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            font-family: sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #000;
        }

        .validity {
            position: absolute;
            top: 67.5%;
            left: 24.5%; /* Positionnée et centrée autour de ce point */
            transform: translateX(-50%);
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            white-space: nowrap;
        }

        .birthdate {
            position: absolute;
            top: 67.5%;
            left: 77.5%; /* Positionnée et centrée autour de ce point */
            transform: translateX(-50%);
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            white-space: nowrap;
        }

        .hitbox {
            position: absolute;
            top: 25%;
            left: 68%;
            width: 25%;
            height: 12%;
            z-index: 10;
            cursor: pointer;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .modal-content h3 {
            margin-top: 0;
            color: #113643;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .modal-content input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            background-color: #f9f9f9;
            outline: none;
            color: #333;
        }

        .modal-content input[type="text"]:focus {
            border-color: #4dc0bb;
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.7; }
        .btn-photo { background-color: #f0f0f0; color: #113643; }
        .btn-save { background-color: #4dc0bb; color: white; margin-top: 10px; }
        .btn-cancel { background-color: transparent; color: #888; font-weight: normal; margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="card">
        
        <div class="top-bar">
            <div class="status">
                <div class="dot"></div>
                &lt; VALIDE
            </div>
            <div class="clock-display" id="clock">---MM-YYYY | HH:MM:SS</div>
        </div>
        
        <div class="isic-number" id="isic">S 000 000 000 000 X</div>
        
        <img class="profile-pic" id="photo" src="" alt="">
        
        <div class="hitbox" onclick="openModal()"></div>
        
        <div class="name" id="name">Karolína Veselá</div>
        
        <div class="validity" id="validity">09/2026 - 12/2027</div>
        <div class="birthdate" id="birthdate">21. 03. 2000</div>
        
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Modifier la carte</h3>
            
            <input type="text" id="inputName" placeholder="Prénom Nom">
            <input type="text" id="inputBirthdate" placeholder="DD. MM. YYYY">
            <input type="text" id="inputValidity" placeholder="MM/YYYY - MM/YYYY">
            
            <button class="btn btn-photo" onclick="document.getElementById('fileInput').click()">📸 Modifier la photo</button>
            <button class="btn btn-save" onclick="saveModal()">Enregistrer</button>
            <button class="btn btn-cancel" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        // Update the real-time clock
        function updateClock() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${d}-${mo}-${y} | ${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Generate or fetch random ISIC number
        function initISIC() {
            let isic = localStorage.getItem('isic_number');
            if (!isic) {
                const r = () => Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                const lastDigit = Math.floor(Math.random() * 10);
                isic = `S ${r()} ${r()} ${r()} ${r()} ${lastDigit} X`;
                localStorage.setItem('isic_number', isic);
            }
            document.getElementById('isic').textContent = isic;
        }

        // Calculate dynamic validity based on current school year
        function getDefaultValidity() {
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const currentYear = now.getFullYear();
            
            // If before September, school year started last year
            const startYear = currentMonth >= 9 ? currentYear : currentYear - 1;
            const endYear = startYear + 1;
            
            return `09/${startYear} - 12/${endYear}`;
        }

        // Load all saved data from localStorage
        function loadData() {
            initISIC();

            const savedName = localStorage.getItem('isic_name');
            if (savedName) document.getElementById('name').textContent = savedName;

            const savedBirth = localStorage.getItem('isic_birthdate');
            if (savedBirth) document.getElementById('birthdate').textContent = savedBirth;

            const savedValidity = localStorage.getItem('isic_validity');
            if (savedValidity) {
                document.getElementById('validity').textContent = savedValidity;
            } else {
                document.getElementById('validity').textContent = getDefaultValidity();
            }

            const savedPhoto = localStorage.getItem('isic_photo');
            const photoEl = document.getElementById('photo');
            if (savedPhoto) {
                photoEl.src = savedPhoto;
                photoEl.style.backgroundColor = 'transparent';
            }
        }
        loadData();

        const modal = document.getElementById('editModal');
        
        function openModal() {
            document.getElementById('inputName').value = document.getElementById('name').textContent;
            document.getElementById('inputBirthdate').value = document.getElementById('birthdate').textContent;
            document.getElementById('inputValidity').value = document.getElementById('validity').textContent;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('fileInput').value = ''; 
        }

        function saveModal() {
            const newName = document.getElementById('inputName').value.trim();
            const newBirth = document.getElementById('inputBirthdate').value.trim();
            const newValidity = document.getElementById('inputValidity').value.trim();
            
            if (newName) {
                document.getElementById('name').textContent = newName;
                localStorage.setItem('isic_name', newName);
            }
            if (newBirth) {
                document.getElementById('birthdate').textContent = newBirth;
                localStorage.setItem('isic_birthdate', newBirth);
            }
            if (newValidity) {
                document.getElementById('validity').textContent = newValidity;
                localStorage.setItem('isic_validity', newValidity);
            }
            
            closeModal();
        }

        // Photo upload with compression for LocalStorage limits
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7); 
                    
                    const photoEl = document.getElementById('photo');
                    photoEl.src = compressedBase64;
                    photoEl.style.backgroundColor = 'transparent';
                    
                    try {
                        localStorage.setItem('isic_photo', compressedBase64);
                    } catch (err) {
                        console.error("Quota localStorage dépassé", err);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
