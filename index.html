<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ISIC">
    <title>Carte Étudiante</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden; /* Empêche le défilement */
            -webkit-user-select: none;
            user-select: none;
        }

        /* Le conteneur reproduit l'écran du téléphone */
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 430px; /* Taille max type iPhone Pro Max */
            margin: 0 auto;
            background-image: url("background.jpg");
            background-color: #4DBBB7; /* Fallback cyan */
            background-size: 100% 100%; /* Force l'image à remplir l'écran pour que les % correspondent */
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Animation du voyant vert */
        @keyframes pulse-green {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.95); }
        }

        .led-green {
            width: 14px;
            height: 14px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: pulse-green 1.5s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }

        /* Barre supérieure (invisible de fond pour se caler sur la maquette) */
        .top-bar-overlay {
            position: absolute;
            top: 5.8%;
            left: 5%;
            width: 90%;
            height: 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-size: 0.95rem;
            z-index: 10;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .clock-right {
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        /* Textes superposés */
        .absolute-text {
            position: absolute;
            color: #1a202c; /* Gris très foncé */
            white-space: nowrap;
        }

        #isic-number {
            top: 14%;
            right: 8%;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Zone cliquable HEC */
        #hec-trigger {
            position: absolute;
            top: 25%;
            right: 5%;
            width: 32%;
            height: 14%;
            background: transparent;
            cursor: pointer;
            z-index: 20;
        }

        /* Photo de profil */
        #photo-container {
            position: absolute;
            top: 25.6%;
            left: 32.5%;
            width: 34.5%;
            height: 23%;
            background-color: white;
            border-radius: 8px; /* Léger arrondi */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #profile-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Prénom et Nom */
        #name-display {
            top: 50.8%;
            width: 100%;
            text-align: center;
            font-size: 1.45rem;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.5px;
        }

        /* Validité et Date de naissance */
        #validity-display {
            top: 66.8%;
            left: 10%;
            font-weight: 700;
            font-size: 1.05rem;
        }

        #dob-display {
            top: 66.8%;
            right: 12%;
            font-weight: 700;
            font-size: 1.05rem;
        }

        /* Modal d'édition personnalisée */
        .modal-backdrop {
            display: none;
            backdrop-filter: blur(5px);
        }
        .modal-backdrop.active {
            display: flex;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Barre de statut supérieure (Noire sur la maquette) -->
        <div class="top-bar-overlay">
            <div class="status-left">
                <span style="font-weight: 700; font-size: 1.2rem;">&lt;</span>
                <div class="led-green"></div>
                <span>VALIDE</span>
            </div>
            <div id="live-clock" class="clock-right">
                --/--/---- | --:--:--
            </div>
        </div>

        <!-- Numéro ISIC -->
        <div id="isic-number" class="absolute-text">S 000 000 000 000 X</div>

        <!-- Zone invisible cliquable sur le logo HEC -->
        <div id="hec-trigger" onclick="openModal()"></div>

        <!-- Photo de profil -->
        <div id="photo-container">
            <img id="profile-pic" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%25%22%20height%3D%22100%25%22%20viewBox%3D%220%200%20100%20100%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M50%2025a15%2015%200%201%200%200%2030%2015%2015%200%200%200%200-30zm0%2035c-15%200-45%207.5-45%2022.5V90h90v-7.5c0-15-30-22.5-45-22.5z%22%20fill%3D%22%23e2e8f0%22%2F%3E%3C%2Fsvg%3E" alt="Profil par défaut">
        </div>

        <!-- Textes variables -->
        <div id="name-display" class="absolute-text">Prénom Nom</div>
        <div id="validity-display" class="absolute-text">--/---- - --/----</div>
        <div id="dob-display" class="absolute-text">DD.MM.YYYY</div>

    </div>

    <div id="edit-modal" class="modal-backdrop fixed inset-0 bg-black/60 z-50 justify-center items-end sm:items-center pb-0 sm:p-4 transition-opacity">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden transform transition-all">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 class="text-xl font-bold text-gray-800 tracking-tight">Modifier les informations</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 text-gray-600 hover:bg-gray-300 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="px-6 py-6 space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Prénom & Nom</label>
                    <input type="text" id="input-name" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-800 font-medium focus:outline-none focus:border-teal-500 transition-colors" placeholder="Ex: Karolína Veselá">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Date de naissance</label>
                    <input type="date" id="input-dob" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-800 font-medium focus:outline-none focus:border-teal-500 transition-colors">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Photo de profil</label>
                    <div class="relative w-full border-2 border-dashed border-gray-300 rounded-xl px-4 py-4 hover:border-teal-500 transition-colors bg-gray-50 text-center">
                        <input type="file" id="input-photo" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <span class="text-gray-600 font-medium text-sm pointer-events-none">Appuyez pour choisir une image</span>
                    </div>
                    <p class="text-xs text-gray-400 mt-2 text-center" id="photo-feedback"></p>
                </div>
            </div>
            
            <div class="px-6 py-5 border-t border-gray-100 bg-gray-50 flex justify-end pb-8 sm:pb-5">
                <button onclick="saveData()" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 w-full shadow-lg shadow-teal-500/30">
                    Enregistrer les modifications
                </button>
            </div>
        </div>
    </div>

    <script>
        // Références DOM
        const els = {
            clock: document.getElementById('live-clock'),
            isic: document.getElementById('isic-number'),
            name: document.getElementById('name-display'),
            dob: document.getElementById('dob-display'),
            validity: document.getElementById('validity-display'),
            photo: document.getElementById('profile-pic'),
            modal: document.getElementById('edit-modal'),
            inputName: document.getElementById('input-name'),
            inputDob: document.getElementById('input-dob'),
            inputPhoto: document.getElementById('input-photo'),
            photoFeedback: document.getElementById('photo-feedback')
        };

        // Initialisation principale
        function initApp() {
            startClock();
            calculateValidity();
            loadUserData();
            generateAppIcon();
        }

        // Génération dynamique de l'icône de l'application (PWA) pour iOS
        function generateAppIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Remplissage du fond
            ctx.fillStyle = '#4dc0bb';
            ctx.fillRect(0, 0, 512, 512);

            // Ajout du texte "ISIC"
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 160px Inter, system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ISIC', 256, 256);

            // Création et injection de la balise link
            const link = document.createElement('link');
            link.rel = 'apple-touch-icon';
            link.href = canvas.toDataURL('image/png');
            document.head.appendChild(link);
        }

        // Horloge temps réel (HH:MM:SS et DD-MM-YYYY)
        function startClock() {
            setInterval(() => {
                const now = new Date();
                
                const d = String(now.getDate()).padStart(2, '0');
                const mo = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                
                els.clock.textContent = `${d}-${mo}-${y} | ${h}:${m}:${s}`;
            }, 1000);
        }

        // Calcul dynamique de l'année scolaire en cours
        function calculateValidity() {
            const now = new Date();
            const currentMonth = now.getMonth() + 1; // 1 à 12
            const currentYear = now.getFullYear();
            
            let startYear = currentYear;
            // Si on est avant septembre, l'année scolaire a commencé l'année précédente
            if (currentMonth < 8) {
                startYear = currentYear - 1;
            }
            const endYear = startYear + 1;
            
            els.validity.textContent = `09/${startYear} - 12/${endYear}`;
        }

        // Génération du numéro ISIC (S 000 000 000 000 X)
        function generateISIC() {
            const rand3 = () => Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            return `S ${rand3()} ${rand3()} ${rand3()} ${rand3()} X`;
        }

        // Chargement des données sauvegardées
        function loadUserData() {
            // Gestion ISIC
            let savedIsic = localStorage.getItem('hec_isic');
            if (!savedIsic) {
                savedIsic = generateISIC();
                localStorage.setItem('hec_isic', savedIsic);
            }
            els.isic.textContent = savedIsic;

            // Gestion Nom
            const savedName = localStorage.getItem('hec_name');
            if (savedName) {
                els.name.textContent = savedName;
                els.inputName.value = savedName;
            }

            // Gestion Date de naissance
            const savedDob = localStorage.getItem('hec_dob');
            if (savedDob) {
                els.dob.textContent = savedDob;
                // Parse "DD.MM.YYYY" en "YYYY-MM-DD" pour l'input
                try {
                    const parts = savedDob.split('.');
                    if(parts.length === 3) els.inputDob.value = `${parts[2]}-${parts[1]}-${parts[0]}`;
                } catch(e) {}
            }

            // Gestion Photo
            const savedPhoto = localStorage.getItem('hec_photo');
            if (savedPhoto) {
                els.photo.src = savedPhoto;
            }
        }

        // Contrôle de la modale
        function openModal() {
            els.modal.classList.add('active');
            els.photoFeedback.textContent = "";
        }

        function closeModal() {
            els.modal.classList.remove('active');
        }

        // Feedback lors du choix d'une image
        els.inputPhoto.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                els.photoFeedback.textContent = `Image sélectionnée : ${e.target.files[0].name}`;
                els.photoFeedback.classList.add('text-teal-600');
            }
        });

        // Fonction pour compresser la photo en Base64 via Canvas
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 500; // Largeur/Hauteur max
                    let width = img.width;
                    let height = img.height;

                    // Conservation du ratio
                    if (width > height && width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    } else if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Export en JPEG qualité moyenne pour limiter le poids dans le localStorage
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    callback(dataUrl);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Sauvegarde de l'ensemble des données
        function saveData() {
            // Validation & Sauvegarde Nom
            const nameVal = els.inputName.value.trim();
            if (nameVal) {
                localStorage.setItem('hec_name', nameVal);
                els.name.textContent = nameVal;
            }

            // Validation & Sauvegarde DOB (Format DD.MM.YYYY)
            if (els.inputDob.value) {
                const [year, month, day] = els.inputDob.value.split('-');
                const formattedDob = `${day}.${month}.${year}`;
                localStorage.setItem('hec_dob', formattedDob);
                els.dob.textContent = formattedDob;
            }

            // Gestion de l'image (Asynchrone)
            const file = els.inputPhoto.files[0];
            if (file) {
                els.photoFeedback.textContent = "Compression en cours...";
                compressImage(file, function(compressedBase64) {
                    try {
                        localStorage.setItem('hec_photo', compressedBase64);
                        els.photo.src = compressedBase64;
                        closeModal();
                    } catch (e) {
                        // Le localStorage a une limite de 5Mo
                        console.error("Erreur de sauvegarde", e);
                        els.photoFeedback.textContent = "Erreur: Image trop lourde, même compressée.";
                        els.photoFeedback.classList.remove('text-teal-600');
                        els.photoFeedback.classList.add('text-red-500');
                    }
                });
            } else {
                closeModal();
            }
        }

        // Démarrage de l'application à la fin du chargement
        window.onload = initApp;

    </script>
</body>
</html>
