<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-title" content="ISIC">
    <title>Carte Étudiante</title>
    
    <style>
        /* Strict white body layout, aligned to top to avoid vertical stretch */
        html, body {
            background-color: white !important;
            margin: 0;
            padding: 0;
            padding-top: env(safe-area-inset-top, 25px);
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Aligns to top instead of center */
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Container that STRICTLY respects the 576/1024 ratio based on width */
        .card-container {
            position: relative;
            width: 100vw;
            max-width: 500px;
            aspect-ratio: 576 / 1024;
            background-image: url('background.jpg');
            background-size: 100% 100%;
            margin-top: 10px; /* Moved slightly up */
            overflow: hidden;
            /* Container queries for responsive fonts inside the card */
            container-type: inline-size;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); /* Optional: slight shadow for depth on white bg */
        }

        /* Top Bar Elements */
        #top-left {
            position: absolute;
            top: 2.2%;
            left: 5%;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 3cqi;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .dot {
            width: 2.8cqi;
            aspect-ratio: 1;
            background-color: #4dc0bb;
            border-radius: 50%;
            animation: blink 1.2s infinite ease-in-out;
        }
        
        #clock {
            position: absolute;
            top: 2.2%;
            right: 5%;
            color: #fff;
            font-size: 2.8cqi;
            font-variant-numeric: tabular-nums;
            font-weight: 400;
        }

        /* ISIC Number */
        #isic {
            position: absolute;
            top: 14%;
            right: 8%;
            color: #111;
            font-size: 2.6cqi;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Profile Photo perfectly fitted to white box */
        #photo {
            position: absolute;
            top: 25.5%;
            left: 32.5%;
            width: 35%;
            height: 23%;
            object-fit: cover;
            border-radius: 5px;
            z-index: 2;
            display: none; /* Hidden by default if no image */
            background-color: #f0f0f0;
        }

        /* Invisible hitbox over HEC logo */
        .hitbox {
            position: absolute;
            top: 28%;
            right: 5%;
            width: 30%;
            height: 15%;
            cursor: pointer;
            z-index: 10;
        }

        /* Text Elements */
        #name {
            position: absolute;
            top: 51%;
            left: 0;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 4.8cqi;
            color: #222;
        }

        #validity {
            position: absolute;
            top: 66.5%;
            left: 8%;
            font-size: 3.2cqi;
            font-weight: 600;
            color: #222;
        }

        #dob {
            position: absolute;
            top: 66.5%;
            right: 10%;
            font-size: 3.2cqi;
            font-weight: 600;
            color: #222;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .modal-content input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px; /* Prevents iOS Safari zoom */
            font-family: inherit;
            background-color: #fafafa;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            display: block;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.7; }
        .btn-photo { background-color: #f0f0f0; color: #333; border: 1px solid #ddd; }
        .btn-save { background-color: #4dc0bb; color: white; margin-top: 10px; }
        .btn-cancel { background-color: transparent; color: #888; font-weight: normal; margin-bottom: 0; padding-bottom: 5px; }
    </style>
</head>
<body>

    <div class="card-container">
        
        <div id="top-left">
            <div class="dot"></div>
            <span>VALIDE</span>
        </div>
        
        <div id="clock">DD-MM-YYYY | HH:MM:SS</div>
        
        <div id="isic">S 000 000 000 000 X</div>
        
        <img id="photo" src="" alt="Profil">
        
        <!-- Hitbox over HEC logo to open settings -->
        <div class="hitbox" onclick="openEditModal()"></div>
        
        <div id="name">Prénom Nom</div>
        
        <div id="validity">09/2024 – 12/2025</div>
        <div id="dob">21. 03. 2000</div>
        
        <!-- Hidden file input for photo upload -->
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#333; font-size: 18px; margin-bottom: 20px;">Modifier la carte</h3>
            
            <input type="text" id="inputName" placeholder="Prénom Nom">
            <input type="text" id="inputDob" placeholder="DD. MM. YYYY">
            
            <button class="btn btn-photo" onclick="document.getElementById('fileInput').click()">📸 Modifier la photo</button>
            <button class="btn btn-save" onclick="saveModalData()">Enregistrer</button>
            <button class="btn btn-cancel" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        // Real-time clock update (DD-MM-YYYY | HH:MM:SS)
        function updateClock() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${d}-${mo}-${y} | ${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Calculate dynamic validity based on current academic year
        function setValidity() {
            const now = new Date();
            const month = now.getMonth() + 1;
            let startYear = now.getFullYear();
            // French academic year starts in September
            if (month < 8) startYear -= 1; 
            document.getElementById('validity').textContent = `09/${startYear} - 12/${startYear + 1}`;
        }
        setValidity();

        // Generate or load ISIC number
        function initISIC() {
            let isic = localStorage.getItem('isic_number');
            if (!isic) {
                // Generates format "S XXX XXX XXX XXX X"
                const r = () => Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                const lastDigit = Math.floor(Math.random() * 10);
                isic = `S ${r()} ${r()} ${r()} ${r()} ${lastDigit} X`;
                localStorage.setItem('isic_number', isic);
            }
            document.getElementById('isic').textContent = isic;
        }
        initISIC();

        // Load saved text and photo data from localStorage instantly
        function loadData() {
            const name = localStorage.getItem('isic_name');
            if (name) document.getElementById('name').textContent = name;
            
            const dob = localStorage.getItem('isic_dob');
            if (dob) document.getElementById('dob').textContent = dob;
            
            const photo = localStorage.getItem('isic_photo');
            const photoEl = document.getElementById('photo');
            if (photo) {
                photoEl.src = photo;
                photoEl.style.display = 'block'; // Make it visible
            }
        }
        loadData();

        // Modal interactions
        const modal = document.getElementById('editModal');
        
        function openEditModal() {
            document.getElementById('inputName').value = document.getElementById('name').textContent;
            document.getElementById('inputDob').value = document.getElementById('dob').textContent;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('fileInput').value = ''; // Reset file input
        }

        // Fast save text only (images are saved independently on change)
        function saveModalData() {
            const newName = document.getElementById('inputName').value.trim();
            const newDob = document.getElementById('inputDob').value.trim();
            
            if (newName) {
                document.getElementById('name').textContent = newName;
                localStorage.setItem('isic_name', newName);
            }
            if (newDob) {
                document.getElementById('dob').textContent = newDob;
                localStorage.setItem('isic_dob', newDob);
            }
            
            closeModal();
        }

        // Handle image upload, compress automatically, and display
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Compress image via Canvas to respect localStorage quota limits
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress to JPEG Base64 (80% quality)
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8); 
                    
                    // Display image instantly
                    const photoEl = document.getElementById('photo');
                    photoEl.src = compressedBase64;
                    photoEl.style.display = 'block';
                    
                    // Save to local storage
                    try {
                        localStorage.setItem('isic_photo', compressedBase64);
                    } catch (err) {
                        console.error("Storage limit exceeded, cannot save photo", err);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
